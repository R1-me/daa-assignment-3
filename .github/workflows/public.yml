name: Public checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public checking tools and Java transport
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Compile and launch Java
        run: python tools/run.py --setup
      - name: Check all public cases and request-state reset
        run: python tools/run.py --check
      - name: Check own cases and route reconstruction
        run: python tests/run_tests.py
